<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
    <link rel="stylesheet" href="css.css">
  <title>نموذج تسجيل الدخول</title>
</head>
<body>
  <h2>🔐 نموذج تسجيل الدخول</h2>

<form id="loginForm" onsubmit="return loginForm();">
  <div>
    <label>الاسم:</label>
    <input type="text" id="username" required>
  </div>

  <div>
    <label>الإيميل:</label>
    <input type="email" id="email" required>
  </div>

  <div>
    <label>كلمة السر:</label>
    <input type="password" id="password" required>
  </div>

  <div class="row">
    <div class="col">
      <label>السنة:</label>
      <select id="years" required></select>
    </div>

    <div class="col">
      <label>الشهر:</label>
      <select id="months" required></select>
    </div>

    <div class="col">
      <label>اليوم:</label>
      <select id="days" required></select>
    </div>
  </div>

  <button type="submit">تسجيل الدخول</button>
</form>


  <script src="js.js"></script>
</body>
</html>
